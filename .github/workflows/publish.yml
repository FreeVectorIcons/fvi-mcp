name: Publish

# Publishes @freevectoricons/mcp to npm via OIDC trusted publishing.
# Only the designated maintainer may start a release; the npm-publish
# environment further scopes which refs can deploy.
on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: "Type the exact package.json version to publish (e.g. 0.2.0-beta.1)"
        required: true
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Hard gate: only the package maintainer can publish, even if others
    # later gain write access when the project is public.
    if: github.actor == 'hemantasapkota'
    environment: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Use npm with trusted-publishing support
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Smoke (empty deps + standalone bundle)
        run: npm run smoke

      - name: Consumer audit (published install graph)
        run: npm run audit:consumer

      - name: Maintainer audit (build inputs)
        run: npm run audit:maintainer

      - name: Verify release version
        env:
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "package.json version=${PKG_VERSION}"

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${CONFIRM_VERSION}" != "${PKG_VERSION}" ]; then
              echo "::error::confirm_version (${CONFIRM_VERSION}) must match package.json (${PKG_VERSION})"
              exit 1
            fi
          else
            TAG_VERSION="${REF_NAME#v}"
            if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
              echo "::error::tag ${REF_NAME} must match package.json version ${PKG_VERSION}"
              exit 1
            fi
          fi

          if npm view "@freevectoricons/mcp@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "::error::@freevectoricons/mcp@${PKG_VERSION} is already on the registry"
            exit 1
          fi

      - name: Publish
        run: npm publish --access public --provenance
